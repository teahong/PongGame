<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pong</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="game-container">
        <div class="ui-layer">
            <div class="score-board">
                <div id="player-score">0</div>
                <div id="ai-score">0</div>
            </div>

            <div id="start-screen" class="overlay">
                <h1>NEON PONG</h1>
                <p>스테이지를 선택하여 도전하세요</p>
                <button id="start-btn" class="neon-button">START GAME</button>
                <p style="font-size: 0.9rem; margin-top: 15px; opacity: 0.6;">(스테이지를 클리어하세요!)</p>
            </div>

            <div id="stage-screen" class="overlay hidden">
                <h1>STAGE SELECT</h1>
                <div id="stage-list" class="stage-grid">
                    <!-- Stages will be generated by JS -->
                </div>
                <button id="back-btn" class="neon-button small" style="margin-top: 20px; scale: 0.7;">BACK</button>
            </div>

            <div id="game-over-screen" class="overlay hidden">
                <h1 id="winner-text"></h1>
                <p id="unlock-msg" style="color: var(--primary-color); font-size: 1rem; margin-bottom: 20px;"></p>
                <button id="restart-btn" class="neon-button">NEXT STAGE</button>
                <button id="menu-btn" class="neon-button small" style="margin-top: 10px; scale: 0.7;">MENU</button>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="script.js"></script>
</body>

</html>
