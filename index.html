<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pong</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="game-container">
        <div class="ui-layer">
            <div class="score-board">
                <div id="player-score">0</div>
                <div id="ai-score">0</div>
            </div>
            <div id="start-screen" class="overlay">
                <h1>NEON PONG</h1>
                <p>버튼을 클릭하거나 스페이스바를 누르세요</p>
                <button id="start-btn" class="neon-button">START</button>
                <p style="font-size: 0.9rem; margin-top: 15px; opacity: 0.6; animation: none;">(10점을 먼저내라!!)
                </p>
            </div>
            <div id="game-over-screen" class="overlay hidden">
                <h1 id="winner-text"></h1>
                <p>다시 시작하려면 버튼을 클릭하거나 스페이스바를 누르세요</p>
                <button id="restart-btn" class="neon-button">RESTART</button>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="script.js"></script>
</body>

</html>
